# ===========================================
# Nginx Security Configuration (Best Practices)
# ===========================================

# ===========================================
# Rate Limiting Zones
# ===========================================
# 30 req/s per IP for general requests
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=30r/s;
# 50 req/s per IP for API
limit_req_zone $binary_remote_addr zone=req_limit_per_ip_api:10m rate=50r/s;

# Connection limits
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
limit_conn_zone $server_name zone=conn_limit_per_server:10m;

# ===========================================
# Request Size Limits
# ===========================================
client_max_body_size 100M;
client_body_buffer_size 256k;
client_header_buffer_size 2k;
large_client_header_buffers 4 16k;

# ===========================================
# Timeouts
# ===========================================
client_body_timeout 60s;
client_header_timeout 60s;
keepalive_timeout 65s;
send_timeout 60s;

# ===========================================
# Security Headers
# ===========================================
# XSS Protection
add_header X-XSS-Protection "1; mode=block" always;
# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;
# Clickjacking protection
add_header X-Frame-Options "SAMEORIGIN" always;
# Referrer policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Strict Transport Security (HSTS)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Content Security Policy (Basic safe defaults for SPA + API)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' ws: wss: http://localhost:* https://localhost:*; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

# Remove Nginx version from headers
server_tokens off;

# ===========================================
# Gzip Compression
# ===========================================
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types 
    text/plain 
    text/css 
    text/xml 
    text/javascript 
    application/json 
    application/javascript 
    application/xml+rss 
    application/atom+xml 
    image/svg+xml 
    application/x-font-ttf 
    application/vnd.ms-fontobject 
    font/opentype
    application/manifest+json;

# ===========================================
# Limit Responses
# ===========================================
limit_req_status 429;
limit_conn_status 429;

# ===========================================
# Security Variables
# ===========================================
map $http_user_agent $block_agent {
    default 0;
    ~*malicious 1;
}
map $http_referer $block_referer {
    default 0;
}
map $args $block_args {
    default 0;
    ~*<script[^>]*> 1;
}
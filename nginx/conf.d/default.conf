# ===========================================
# Global Entrypoint - Nginx Internal Proxy Configuration
# Optimized for Vite (React) + FastAPI
# ===========================================

# WebSocket upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ===========================================
# Upstreams
# ===========================================

upstream frontend_app {
    server frontend:8080;
    keepalive 32;
}

upstream backend_api {
    server api:8000;
    keepalive 32;
}

# ===========================================
# Server Block
# ===========================================

server {
    listen 80;
    server_name _;
    
    # Root for cache directories
    root /var/cache/nginx;
    
    # Security: Block invalid HTTP methods (allow OPTIONS for CORS)
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$ ) {
        return 405;
    }
    
    # Security: Block suspicious requests early
    if ($block_agent) { return 403; }
    if ($block_referer) { return 403; }
    if ($block_args) { return 403; }
    
    # Rate limiting
    limit_conn conn_limit_per_ip 50;
    limit_conn conn_limit_per_server 2000;
    limit_req zone=req_limit_per_ip burst=50 nodelay;
    limit_req_status 429;
    limit_conn_status 429;
    
    # Security logging
    access_log /var/log/nginx/access.log main;
    
    # Hide server information
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    # ───────────────────────────────────────
    # Health Check
    # ───────────────────────────────────────
    
    location = /health {
        proxy_pass http://backend_api/health;
        include /etc/nginx/proxy.conf;
        access_log off;
    }

    # ───────────────────────────────────────
    # API Routes (/api/)
    # ───────────────────────────────────────
    
    location /api/ {
        # General rate limiting for API
        limit_req zone=req_limit_per_ip_api burst=20 nodelay;
        
        # CORS headers (handled dynamically or by backend, but safe defaults)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-Session-Token" always;
        
        if ($request_method = OPTIONS) {
            add_header Access-Control-Max-Age 3600 always;
            return 204;
        }

        proxy_pass http://backend_api;
        include /etc/nginx/proxy.conf;
        
        proxy_cache off;
    }

    # ───────────────────────────────────────
    # Default - Frontend App (Vite)
    # ───────────────────────────────────────
    
    location / {
        proxy_pass http://frontend_app;
        include /etc/nginx/proxy.conf;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        proxy_cache off;
        
        # Intercept 404 errors from the frontend to handle SPA routing
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
    
    # Internal route for SPA fallback
    location = /index.html {
        proxy_pass http://frontend_app/index.html;
        include /etc/nginx/proxy.conf;
        proxy_cache off;
    }

    # ───────────────────────────────────────
    # Security - Block hidden files
    # ───────────────────────────────────────
    
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
